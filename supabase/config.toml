# Configuration Supabase locale (`supabase start`). Nécessite Docker Desktop.
project_id = "koursa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:8081", "koursa-client://", "koursa-courier://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Votre code Koursa : {{ .Code }}"
max_frequency = "30s"

# Numéros de test : le code 123456 fonctionne sans envoyer de SMS (développement uniquement).
[auth.sms.test_otp]
22890000001 = "123456"
22890000002 = "123456"
22890000011 = "123456"
22890000012 = "123456"
22890000013 = "123456"
22890000021 = "123456"
22890000022 = "123456"
22890000023 = "123456"
22899999999 = "123456"

# Un fournisseur doit être déclaré pour l'envoi de SMS. En production, configurer le vrai
# fournisseur dans le tableau de bord Supabase (Auth → Providers → Phone).
[auth.sms.twilio]
enabled = true
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.places-autocomplete]
verify_jwt = true
[functions.place-details]
verify_jwt = true
[functions.reverse-geocode]
verify_jwt = true
[functions.route]
verify_jwt = true
[functions.quote]
verify_jwt = true
[functions.create-delivery]
verify_jwt = true
[functions.accept-offer]
verify_jwt = true
[functions.notify]
verify_jwt = false
